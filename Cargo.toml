[package]
name = "afterglow"
version = "0.1.0"
edition = "2024"
description = "GitHub star telemetry: daily snapshots, measured velocity"
license-file = "LICENSE.md"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4.6", features = ["derive", "env"] }
maud = "0.27.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json", "query", "charset", "http2"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
